<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>龍王站位編排小工具</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Microsoft JhengHei", Arial, sans-serif;
    background: #101827;
    color: #fff;
  }
  header {
    padding: 14px 18px;
    background: linear-gradient(90deg, #1d4ed8, #0f172a);
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 22px; }
  .wrap {
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 14px;
    padding: 14px;
  }
  .panel {
    background: rgba(15, 23, 42, .92);
    border: 1px solid rgba(148, 163, 184, .35);
    border-radius: 16px;
    padding: 14px;
    box-shadow: 0 12px 30px rgba(0,0,0,.3);
  }
  .panel h2 { margin: 0 0 10px; font-size: 18px; }
  .input-row { display: flex; gap: 8px; margin-bottom: 10px; }
  input {
    flex: 1;
    border: 1px solid #334155;
    background: #020617;
    color: #fff;
    border-radius: 10px;
    padding: 10px;
    font-size: 15px;
  }
  button {
    border: 0;
    border-radius: 10px;
    padding: 10px 12px;
    background: #2563eb;
    color: white;
    cursor: pointer;
    font-weight: 700;
  }
  button:hover { filter: brightness(1.1); }
  button.secondary { background: #475569; }
  button.danger { background: #dc2626; }
  button.green { background: #16a34a; }
  .hint { font-size: 13px; color: #cbd5e1; line-height: 1.6; margin: 8px 0 10px; }
  .people { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .person {
    padding: 9px 10px;
    background: #1e293b;
    border: 1px solid #475569;
    border-radius: 12px;
    cursor: grab;
    user-select: none;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
    min-height: 40px;
  }
  .person.assigned { opacity: .45; }
  .person.selected { outline: 3px solid #facc15; }
  .person small { color: #93c5fd; font-size: 11px; }
  .person .x {
    background: transparent;
    color: #fca5a5;
    padding: 0;
    font-size: 16px;
  }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .map-box {
    position: relative;
    width: 100%;
    max-width: 1280px;
    aspect-ratio: 1280 / 640;
    margin: auto;
    background-image: url("background.png"png;
    background-size: cover;
    background-position: center;
    border-radius: 18px;
    overflow: hidden;
    border: 2px solid rgba(191, 219, 254, .4);
  }
  .spot {
    position: absolute;
    transform: translate(-50%, -50%);
    width: 132px;
    min-height: 56px;
    border: 2px dashed rgba(255,255,255,.8);
    border-radius: 14px;
    background: rgba(15, 23, 42, .55);
    backdrop-filter: blur(2px);
    padding: 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .spot:hover { background: rgba(37, 99, 235, .45); }
  .spot-title {
    text-align: center;
    font-size: 12px;
    color: #e0f2fe;
    font-weight: 700;
    line-height: 1.1;
  }
  .slot-person {
    background: linear-gradient(135deg, #facc15, #fb923c);
    color: #111827;
    border-radius: 999px;
    padding: 4px 8px;
    font-size: 13px;
    font-weight: 900;
    text-align: center;
    cursor: pointer;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .empty { font-size: 12px; color: #cbd5e1; text-align: center; margin-top: 3px; }
  .legend {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    color: #cbd5e1;
    font-size: 13px;
    margin-top: 10px;
  }
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 50;
    padding: 20px;
  }
  .modal.show { display: flex; }
  .modal-card {
    background: #0f172a;
    border: 1px solid #475569;
    border-radius: 18px;
    padding: 18px;
    max-width: 420px;
    width: 100%;
  }
  .mobile-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
  @media (max-width: 900px) {
    .wrap { grid-template-columns: 1fr; }
    .people { grid-template-columns: 1fr 1fr 1fr; }
    .spot { width: 96px; min-height: 48px; }
    .spot-title { font-size: 10px; }
    .slot-person { font-size: 11px; padding: 3px 6px; }
  }
  @media (max-width: 560px) {
    header h1 { font-size: 18px; }
    .people { grid-template-columns: 1fr 1fr; }
    .wrap { padding: 8px; }
    .panel { padding: 10px; }
    .map-box { border-radius: 12px; }
    .spot { width: 76px; min-height: 42px; border-radius: 10px; padding: 3px; }
    .empty { display:none; }
  }
</style>
</head>
<body>
<header>
  <h1>龍王站位編排小工具</h1>
  <div>人數：<b id="countText">0 / 12</b></div>
</header>

<div class="wrap">
  <section class="panel">
    <h2>12 人名單</h2>
    <div class="input-row">
      <input id="nameInput" placeholder="輸入角色名稱" maxlength="12" />
      <button onclick="addPerson()">新增</button>
    </div>
    <div class="hint">
      電腦：直接拖曳角色到平台。<br>
      手機：先點角色，再點平台。<br>
      點平台上的名字可移除站位。
    </div>
    <div id="people" class="people"></div>
    <div class="toolbar">
      <button class="secondary" onclick="fillDemo()">快速建立 12 人</button>
      <button class="danger" onclick="clearPositions()">清空站位</button>
      <button class="danger" onclick="resetAll()">重置全部</button>
    </div>
  </section>

  <section class="panel">
    <h2>地圖站位</h2>
    <div class="map-box" id="mapBox"></div>
    <div class="legend">
      <span>黃色＝已安排角色</span>
      <span>虛線框＝可放置平台</span>
      <span>平台位置可在 JS 的 spots 座標自行調整</span>
    </div>
  </section>
</div>

<div id="pickModal" class="modal" onclick="closeModal(event)">
  <div class="modal-card">
    <h2 id="modalTitle">選擇角色</h2>
    <div class="hint">請選擇要放到此平台的人員。</div>
    <div id="mobilePickList" class="mobile-list"></div>
    <div class="toolbar">
      <button class="secondary" onclick="hidePickModal()">取消</button>
    </div>
  </div>
</div>

<script>
const MAX_PEOPLE = 12;
const STORAGE_KEY = 'horntail_position_tool_v1';
let people = [];
let selectedPersonId = null;
let targetSpotId = null;

// x/y 是百分比座標，可自己微調位置
const spots = [
  { id:'L_TOP', name:'左上平台', x:9, y:31 },
  { id:'L_MID', name:'左中平台', x:8, y:56 },
  { id:'L_LOW', name:'左下平台', x:13, y:79 },
  { id:'C_TOP_L', name:'中上左平台', x:25, y:20 },
  { id:'C_TOP_R', name:'中上右平台', x:68, y:14 },
  { id:'C_MID', name:'中央平台', x:56, y:45 },
  { id:'R_TOP', name:'右上平台', x:82, y:29 },
  { id:'R_MID', name:'右中平台', x:88, y:48 },
  { id:'R_LOW', name:'右下平台', x:85, y:70 },
  { id:'BOTTOM', name:'底部集合', x:62, y:90 }
];

function uid() { return 'p_' + Math.random().toString(36).slice(2, 9); }
function save() { localStorage.setItem(STORAGE_KEY, JSON.stringify({ people })); }
function load() {
  try {
    const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
    people = Array.isArray(data.people) ? data.people : [];
  } catch(e) { people = []; }
}
function addPerson() {
  const input = document.getElementById('nameInput');
  const name = input.value.trim();
  if (!name) return alert('請輸入角色名稱');
  if (people.length >= MAX_PEOPLE) return alert('最多只能建立 12 人');
  if (people.some(p => p.name === name)) return alert('名稱重複');
  people.push({ id: uid(), name, spotId: null });
  input.value = '';
  save(); render();
}
function removePerson(id) {
  if (!confirm('確定刪除此角色？')) return;
  people = people.filter(p => p.id !== id);
  if (selectedPersonId === id) selectedPersonId = null;
  save(); render();
}
function selectPerson(id) {
  selectedPersonId = selectedPersonId === id ? null : id;
  renderPeople();
}
function assignToSpot(personId, spotId) {
  const p = people.find(x => x.id === personId);
  if (!p) return;
  p.spotId = spotId;
  selectedPersonId = null;
  hidePickModal();
  save(); render();
}
function removeFromSpot(personId) {
  const p = people.find(x => x.id === personId);
  if (p) p.spotId = null;
  save(); render();
}
function onSpotClick(spotId) {
  if (selectedPersonId) return assignToSpot(selectedPersonId, spotId);
  targetSpotId = spotId;
  showPickModal(spotId);
}
function showPickModal(spotId) {
  document.getElementById('modalTitle').textContent = '選擇角色 → ' + spots.find(s=>s.id===spotId).name;
  const list = document.getElementById('mobilePickList');
  list.innerHTML = '';
  people.forEach(p => {
    const btn = document.createElement('button');
    btn.className = p.spotId ? 'secondary' : 'green';
    btn.textContent = p.name + (p.spotId ? '（已站位）' : '');
    btn.onclick = () => assignToSpot(p.id, spotId);
    list.appendChild(btn);
  });
  if (!people.length) list.innerHTML = '<div class="hint">尚未建立名單</div>';
  document.getElementById('pickModal').classList.add('show');
}
function hidePickModal() { document.getElementById('pickModal').classList.remove('show'); }
function closeModal(e) { if (e.target.id === 'pickModal') hidePickModal(); }
function clearPositions() {
  if (!confirm('確定清空所有站位？')) return;
  people.forEach(p => p.spotId = null);
  selectedPersonId = null;
  save(); render();
}
function resetAll() {
  if (!confirm('確定重置全部名單與站位？')) return;
  people = [];
  selectedPersonId = null;
  save(); render();
}
function fillDemo() {
  if (people.length && !confirm('會覆蓋目前名單，確定？')) return;
  people = Array.from({length:12}, (_,i)=>({ id:uid(), name:'隊員' + String(i+1).padStart(2,'0'), spotId:null }));
  save(); render();
}
function renderPeople() {
  const box = document.getElementById('people');
  box.innerHTML = '';
  people.forEach(p => {
    const div = document.createElement('div');
    div.className = 'person' + (p.spotId ? ' assigned' : '') + (selectedPersonId === p.id ? ' selected' : '');
    div.draggable = true;
    div.ondragstart = ev => ev.dataTransfer.setData('text/plain', p.id);
    div.onclick = () => selectPerson(p.id);
    const spotName = p.spotId ? spots.find(s=>s.id===p.spotId)?.name || '' : '未站位';
    div.innerHTML = `<span>${p.name}<br><small>${spotName}</small></span><button class="x" onclick="event.stopPropagation();removePerson('${p.id}')">×</button>`;
    box.appendChild(div);
  });
  document.getElementById('countText').textContent = `${people.length} / ${MAX_PEOPLE}`;
}
function renderMap() {
  const map = document.getElementById('mapBox');
  map.innerHTML = '';
  spots.forEach(s => {
    const spot = document.createElement('div');
    spot.className = 'spot';
    spot.style.left = s.x + '%';
    spot.style.top = s.y + '%';
    spot.ondragover = ev => ev.preventDefault();
    spot.ondrop = ev => {
      ev.preventDefault();
      assignToSpot(ev.dataTransfer.getData('text/plain'), s.id);
    };
    spot.onclick = () => onSpotClick(s.id);
    const assigned = people.filter(p => p.spotId === s.id);
    spot.innerHTML = `<div class="spot-title">${s.name}</div>`;
    if (!assigned.length) {
      const empty = document.createElement('div');
      empty.className = 'empty';
      empty.textContent = '放到這裡';
      spot.appendChild(empty);
    }
    assigned.forEach(p => {
      const tag = document.createElement('div');
      tag.className = 'slot-person';
      tag.textContent = p.name;
      tag.title = '點擊移除站位';
      tag.onclick = ev => { ev.stopPropagation(); removeFromSpot(p.id); };
      spot.appendChild(tag);
    });
    map.appendChild(spot);
  });
}
function render() { renderPeople(); renderMap(); }

document.getElementById('nameInput').addEventListener('keydown', e => { if(e.key === 'Enter') addPerson(); });
load(); render();
</script>
</body>
</html>
